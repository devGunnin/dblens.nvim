name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One job, matrixed on the documented Neovim floor plus stable and nightly, running both lint
  # and test. sqlite3 and the duckdb binary are installed so tests/spec/engines_spec.lua's live
  # sqlite/duckdb groups actually run here.
  #
  # THE FOUR SERVER ENGINES ARE NOT EXERCISED HERE. postgres, mysql, mariadb and mssql need
  # `DBLENS_TEST_<KIND>_PORT` (unset in CI), so their live groups skip with a MiniTest note, which
  # is not a failure but is also not coverage: those proofs run only where a maintainer supplies a
  # server. The README says so rather than implying CI covers all six. A service-container job was
  # judged not worth the cost for this repo: throwaway credentials wired through Actions
  # secrets/services, and roughly double the runtime.
  ci:
    runs-on: ubuntu-latest
    strategy:
      # Every version always reports; nightly breaking does not hide a stable failure, and the
      # 0.10 entry is the documented minimum (plugin/dblens.lua, health.lua, README) — without it
      # a 0.11+ API creeping in ships green and breaks the version dblens promises to support.
      fail-fast: false
      matrix:
        neovim: [v0.10.4, stable, nightly]
    name: ci (${{ matrix.neovim }})
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      # Pinned, both of them: an unpinned duckdb `latest` turns CI red on an unchanged repo the
      # day duckdb changes its CLI output, and the decoder is tested against that output.
      - name: Install sqlite3, duckdb and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 unzip lua-check
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/duckdb

      - name: Versions
        run: |
          nvim --version
          sqlite3 --version
          duckdb --version

      # Pinned for the same reason: a stylua release with a new default turns CI red on code
      # nobody touched.
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.4.1
          args: --check .

      - name: Luacheck
        run: luacheck lua tests

      - name: Test
        run: make test
