name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both Neovim versions always report; nightly breaking does not hide a stable failure.
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    name: test (${{ matrix.neovim }})
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Versions
        run: |
          nvim --version
          sqlite3 --version

      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check

      - name: Luacheck
        run: luacheck lua tests
